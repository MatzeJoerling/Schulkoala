<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Koala-Detektei</title>
<style>
html{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body{margin:0}
/* Layout: ein Vollbild-Spiel, oben Leiste, Mitte Szene, unten große Antwortfelder. Farbwelt: Hellblau, Türkis, Mint, zartes Rosa, Regenbogen-Akzente. */
:root{
  --ink:#1d3a57; --ink2:#52708c; --sky:#e3f5ff; --mint:#c9f2e3; --mint-d:#1fa88a;
  --turq:#2bb5b0; --blue:#4a90d9; --rose:#ffd3e2; --rose-d:#e0689a; --sun:#ffe28a; --lav:#e3d9ff;
  --card:#ffffff; --line:#b7e0ec; --shadow:0 6px 0 rgba(74,144,217,.22);
  --f-disp:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold','Avenir Next Rounded',system-ui,sans-serif;
  --f-kid:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold','Chalkboard SE',system-ui,sans-serif;
  --f-ui:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(#dcf2ff 0%,#e6fbf4 62%,#fff0f6 100%);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bg svg.rb{position:absolute;left:50%;top:-2vmin;width:120vmax;max-width:none;transform:translateX(-50%);opacity:.55}
#bg svg.cl{position:absolute;height:auto;opacity:.92;filter:drop-shadow(0 6px 8px rgba(120,170,220,.25));animation:drift 24s ease-in-out infinite alternate}
#bg svg.cl.a{width:26vmin;left:4%;top:20%}
#bg svg.cl.b{width:34vmin;right:5%;top:11%;animation-duration:31s;animation-delay:-9s}
#bg svg.cl.c{width:20vmin;left:44%;top:40%;opacity:.7;animation-duration:38s;animation-delay:-16s}
@keyframes drift{from{transform:translateX(-4vmin)}to{transform:translateX(5vmin)}}
#bg .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:22vmin}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-inline:max(16px,3vmin);padding-block:max(10px,1.5vmin);max-width:1200px;margin-inline:auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.ico{width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:30px;display:grid;place-items:center;border:3px solid var(--line)}
.rgt{display:flex;gap:12px}
.ico.voice{flex-direction:column;gap:0;line-height:1;background:var(--mint);border-color:var(--mint-d)}
.ico.voice{width:76px;border-radius:32px;align-content:center;row-gap:2px}
.ico.voice .vi{font-size:24px}
.ico.voice small{font-size:12px;font-weight:800;color:var(--ink2)}
.ico.voice.off{background:#eef2f5;border-color:#b9c6d1;filter:grayscale(.6)}
[hidden]{display:none!important}
.ico.small{width:48px;height:48px;font-size:20px;opacity:.7}
.ico:active,.btn:active,.tile:active,.case:active{transform:translateY(3px);box-shadow:none}
.pips{display:flex;gap:10px}
.pip{width:clamp(22px,4vmin,34px);height:clamp(22px,4vmin,34px);border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-size:clamp(12px,2.4vmin,20px)}
.pip.on{background:var(--sun);border-color:#f2c94c}
.pip.now{border-color:var(--turq);transform:scale(1.2)}
.btn{background:linear-gradient(#5fd0c6,var(--turq));color:#fff;font-family:var(--f-disp);font-weight:800;font-size:clamp(24px,4.5vmin,40px);padding:.35em 1.3em;border-radius:999px;box-shadow:0 6px 0 #1a8a86;min-height:72px}
.btn.rose{background:linear-gradient(#ff9fc3,var(--rose-d));box-shadow:0 6px 0 #b04671}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow);border:3px solid var(--line);font-weight:600}
.btn.sm{font-size:20px;min-height:52px;padding:.25em 1em}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;text-align:center;min-height:0}
svg.koala{width:clamp(130px,30vmin,300px);height:auto;filter:drop-shadow(0 8px 0 rgba(74,144,217,.18))}
svg.koala.sm{width:clamp(86px,15vmin,150px)}
svg.koala .eye{transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.4vmin)}}
.bubble{background:#fff;border:4px solid var(--line);border-radius:32px;padding:.6em 1em;font-family:var(--f-kid);font-weight:700;font-size:clamp(22px,4.2vmin,42px);line-height:1.3;max-width:min(92vw,900px);box-shadow:var(--shadow)}
.bubble .pic{display:block;font-size:clamp(70px,16vmin,160px);line-height:1.1;margin-bottom:.1em}
.stage{display:flex;align-items:center;justify-content:center;gap:2vmin;flex-wrap:wrap}
.homehead{padding-block:0 1.2vmin}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 6px 24px;-webkit-overflow-scrolling:touch}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,24vmin,240px),1fr));gap:2vmin;width:100%}
.case{position:relative}
.case .num{position:absolute;top:8px;left:10px;min-width:1.7em;height:1.7em;border-radius:50%;background:var(--sun);border:3px solid #f2c94c;font-family:var(--f-kid);font-weight:700;font-size:clamp(16px,3vmin,26px);display:grid;place-items:center}
.case.al{background:linear-gradient(#fff,#fff3d6)}
.case{background:#fff;border:4px solid var(--line);border-radius:36px;box-shadow:var(--shadow);padding:1.6vmin 1vmin;display:flex;flex-direction:column;align-items:center;gap:.6vmin;min-width:0}
.case .cpic{font-size:clamp(54px,13vmin,120px);line-height:1.1}
.case .ctitle{overflow-wrap:anywhere;hyphens:auto;font-family:var(--f-disp);font-weight:800;font-size:clamp(15px,2.6vmin,26px);line-height:1.15;color:var(--ink)}
.case .cst{font-size:clamp(16px,2.8vmin,26px);min-height:1.3em;letter-spacing:2px}
.case.c1{background:linear-gradient(#fff,#ffeaf2)}.case.c2{background:linear-gradient(#fff,#dcf8ec)}.case.c3{background:linear-gradient(#fff,#e7e0ff)}.case.tr{background:linear-gradient(#fff,#dff2ff)}
.homebar{display:flex;justify-content:center;gap:2vmin;margin-top:2vmin}
/* Rätsel */
.riddle{flex:1;display:flex;flex-direction:column;gap:1.6vmin;min-height:0}
.qrow{display:flex;align-items:center;gap:2vmin;justify-content:center;flex-wrap:nowrap}
.prompt{font-family:var(--f-kid);font-weight:700;font-size:clamp(24px,5.4vmin,54px);line-height:1.25;max-width:min(100%,900px);background:#fff;border:4px solid var(--line);border-radius:30px;padding:.25em .7em;box-shadow:var(--shadow);text-align:center}
.prompt b{color:var(--rose-d);font-size:1.25em}
.rbody{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;flex-wrap:wrap;gap:3vmin}
.eq{display:flex;align-items:center;justify-content:center;gap:2.5vmin;flex-wrap:wrap}
.eqd{font-family:var(--f-kid);font-weight:700;font-size:clamp(50px,14vmin,130px);display:flex;align-items:center;gap:2vmin;color:var(--ink)}
.eqd .q{color:var(--rose-d)}
.grp{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:.6vmin;max-width:min(38vw,50vmin);background:rgba(255,255,255,.7);border:3px dashed var(--line);border-radius:26px;padding:1.2vmin;min-width:12vmin}
.grp.big{max-width:min(70vw,70vmin)}
.it{position:relative;font-size:clamp(28px,7.5vmin,74px);line-height:1.05;transition:transform .2s,opacity .3s}
.it.gone{opacity:.25;filter:grayscale(1)}
.it.gone::after{content:'✖';position:absolute;inset:0;display:grid;place-items:center;color:var(--rose-d);font-size:.9em}
.it.n::before{content:attr(data-n);position:absolute;top:-.3em;right:-.1em;background:var(--rose-d);color:#fff;font-family:var(--f-kid);font-weight:700;font-size:.42em;min-width:1.5em;height:1.5em;border-radius:1em;display:grid;place-items:center;z-index:2}
.seq{display:flex;gap:2vmin}
.seq .sq{width:clamp(64px,16vmin,150px);height:clamp(64px,16vmin,150px);border-radius:26px;background:#fff;border:4px solid var(--line);display:grid;place-items:center;font-family:var(--f-kid);font-weight:700;font-size:clamp(40px,10vmin,96px)}
.seq .sq.q{background:var(--rose);border-color:var(--rose-d);color:var(--rose-d)}
.bigpic{font-size:clamp(100px,30vmin,300px);line-height:1}
.wordhint{font-family:var(--f-kid);font-weight:700;font-size:clamp(40px,10vmin,90px);display:flex;align-items:center;gap:2vmin}
.wordhint em{font-style:normal;color:var(--rose-d);font-size:1.3em}
.opts{display:flex;gap:2.4vmin;justify-content:center;flex-wrap:wrap;padding-bottom:1vmin}
.tile{min-width:clamp(88px,21vmin,190px);height:clamp(88px,21vmin,190px);padding:0 1vmin;background:#fff;border:5px solid var(--turq);border-radius:32px;box-shadow:0 8px 0 rgba(43,181,176,.35);font-family:var(--f-kid);font-weight:700;font-size:clamp(44px,12vmin,110px);color:var(--ink);display:grid;place-items:center;transition:transform .15s}
.tile.two{height:auto;min-height:clamp(120px,32vmin,300px);min-width:clamp(140px,40vmin,420px)}
.tile:disabled{opacity:.4}
.tile.ok{background:var(--mint);border-color:var(--mint-d);animation:pop .5s}
.tile.bad{background:var(--rose);border-color:var(--rose-d);animation:shake .4s}
.tile.glow{animation:glow 1s infinite}
@keyframes pop{40%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes glow{50%{box-shadow:0 0 0 12px rgba(255,226,138,.9)}}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vmin}
.fgrid .tile{min-width:0;width:clamp(70px,17vmin,150px);height:clamp(60px,12.5vmin,120px);font-size:clamp(36px,9vmin,80px)}
.tile.found{background:var(--mint);border-color:var(--mint-d)}
.target{font-family:var(--f-kid);font-weight:700;font-size:clamp(28px,6vmin,56px);background:var(--rose);border:4px solid var(--rose-d);border-radius:24px;padding:.1em .6em;color:var(--rose-d)}
/* Hinweise / Verdächtige */
.bubble.cbub .pic{font-size:clamp(50px,11vmin,110px)}
.deduce{display:flex;align-items:center;gap:1.4vmin;background:var(--mint);border:4px solid var(--mint-d);border-radius:28px;padding:.5em .9em;font-family:var(--f-kid);font-weight:700;font-size:clamp(20px,3.8vmin,38px);line-height:1.3;max-width:min(92vw,900px);box-shadow:var(--shadow)}
.deduce .dq{font-size:1.6em}
.grp.five{display:grid;grid-template-columns:repeat(5,auto)}
.grp.sm .it{font-size:clamp(20px,4.6vmin,46px)}
.grp.big.sm .it{font-size:clamp(24px,6vmin,56px)}
.pool{display:flex;flex-wrap:wrap;gap:1vmin;justify-content:center;align-content:center;max-width:min(44vw,60vmin)}
.bigeq{flex-wrap:nowrap}
.bigeq .pool{max-width:38vw}
.eqd.sm{font-size:clamp(34px,8.5vmin,90px)}
@media (orientation:portrait){.bigeq{flex-wrap:wrap}.bigeq .pool{max-width:86vw}}
.eq .dt{font-size:clamp(11px,2.2vmin,24px)}
.pool.big{max-width:min(92vw,112vmin);gap:1.4vmin}
.tb{display:grid;grid-template-columns:repeat(5,auto);background:rgba(255,255,255,.8);border:3px solid var(--turq);border-radius:14px;padding:.4vmin .6vmin;transition:background .3s,transform .3s}
.tb.un{border-style:dashed;border-color:var(--rose-d)}
.tb.hl{background:var(--mint);transform:scale(1.06)}
.dt{font-size:clamp(13px,3vmin,30px);line-height:1.1}
.pool.big .dt{font-size:clamp(14px,3.6vmin,36px)}
.seq.mu{flex-wrap:wrap;justify-content:center;max-width:94vw}
.seq.mu .sq{width:clamp(44px,11vmin,110px);height:clamp(44px,11vmin,110px);font-size:clamp(26px,7vmin,70px);border-radius:20px}
.seq .sq.hl,.tb.hl{transform:scale(1.15)}
.seq.w3 .sq{font-size:clamp(28px,7vmin,66px)}
.clues{display:flex;gap:1.6vmin;justify-content:center;flex-wrap:wrap}
.clue{width:clamp(56px,12vmin,110px);height:clamp(56px,12vmin,110px);border-radius:24px;background:#fff;border:4px solid var(--line);display:grid;place-items:center;font-size:clamp(30px,7vmin,64px);box-shadow:var(--shadow)}
.clue.empty{background:rgba(255,255,255,.4);border-style:dashed;box-shadow:none}
.suspects{display:flex;gap:2.4vmin;justify-content:center;flex-wrap:wrap}
.susp{background:#fff;border:5px solid var(--line);border-radius:36px;box-shadow:var(--shadow);padding:1.2vmin 3vmin;font-size:clamp(70px,18vmin,180px);line-height:1.15}
.susp.bad{background:var(--rose);border-color:var(--rose-d);animation:shake .4s}
.susp.ok{background:var(--mint);border-color:var(--mint-d);animation:pop .6s}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(74px,15vmin,130px),1fr));gap:1.6vmin;width:100%;overflow:auto;padding:6px}
.stk{aspect-ratio:1;background:#fff;border:4px solid var(--line);border-radius:28px;display:grid;place-items:center;font-size:clamp(40px,9vmin,80px);box-shadow:var(--shadow)}
.stk.lock{filter:grayscale(1) brightness(1.35) contrast(.5);opacity:.5}
.lgrow{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center}
.wcard{background:#fff;border:4px solid var(--line);border-radius:28px;padding:1vmin 2vmin;font-family:var(--f-kid);font-weight:700;font-size:clamp(22px,4vmin,40px);display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow)}
.wcard span{font-size:clamp(50px,11vmin,110px);line-height:1.1}
.wcard b{color:var(--rose-d)}
.bigL{font-family:var(--f-kid);font-weight:700;font-size:clamp(120px,30vmin,300px);line-height:1;background:linear-gradient(90deg,#ff7aa8,#ffb45e,#7bd88f,#4fc3f7,#9b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#confetti{position:fixed;inset:0;z-index:5;pointer-events:none}
/* Elternbereich */
.par{background:rgba(255,255,255,.92);border-radius:28px;padding:18px;overflow:auto;flex:1;min-height:0;font-size:18px;line-height:1.45;-webkit-user-select:text;user-select:text}
.par h2{font-family:var(--f-disp);margin:.2em 0 .3em;font-size:26px}
.par h3{font-family:var(--f-disp);margin:1em 0 .3em;font-size:20px}
.par p{margin:.4em 0;color:var(--ink2)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:10px 16px;border-radius:999px;background:#fff;border:3px solid var(--line);font-weight:800;min-height:48px}
.tab.on{background:var(--turq);border-color:var(--turq);color:#fff}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.lt{border-radius:18px;border:3px solid var(--line);background:#f1f5f8;min-height:74px;font-family:var(--f-kid);font-weight:700;font-size:32px;position:relative;color:#8aa0b3}
.lt.on{background:var(--mint);border-color:var(--mint-d);color:var(--ink)}
.lt small{position:absolute;left:8px;right:8px;bottom:6px;height:5px;border-radius:3px;background:#dbe6ee;overflow:hidden;display:block}
.lt small i{display:block;height:100%;background:var(--mint-d)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #e3edf3}
.row .lbl{flex:1;min-width:160px;font-weight:700}
.row .st{font-size:14px;color:var(--ink2);min-width:110px}
.mini{min-width:48px;min-height:48px;border-radius:14px;background:#fff;border:3px solid var(--line);font-size:20px}
.mini.rec{background:var(--rose);border-color:var(--rose-d)}
.bar{height:14px;border-radius:8px;background:#e3edf3;overflow:hidden;min-width:120px;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5fd0c6,#4a90d9)}
.par input[type=text],.par textarea,.par select{font:inherit;border:3px solid var(--line);border-radius:14px;padding:10px;width:100%;background:#fff;color:var(--ink)}
.par textarea{min-height:120px;font-size:13px;word-break:break-all}
.note{background:var(--sky);border-radius:16px;padding:10px 14px;margin:8px 0;font-size:16px}
.warn{background:#fff3d6}
.keys{display:grid;grid-template-columns:repeat(3,clamp(70px,14vmin,110px));gap:10px;justify-content:center}
.keys .tile{min-width:0;width:100%;height:clamp(60px,12vmin,96px);font-size:clamp(30px,6vmin,52px)}
@media (max-width:520px){.ico{width:52px;height:52px;font-size:24px}.ico.voice{width:60px;border-radius:26px}.ico.voice .vi{font-size:20px}.rgt{gap:6px}.top{gap:6px}.pips{gap:5px}.pip{width:20px;height:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="bg" aria-hidden="true">
  <svg class="rb" viewBox="0 0 400 200" preserveAspectRatio="xMidYMin meet"><g fill="none" stroke-width="12">

<script>
'use strict';
/* ================= Hilfen ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

  const cols = ['#ff7aa8', '#ffb45e', '#ffe28a', '#7bd88f', '#4fc3f7', '#9b8cff'];
  const ps = Array.from({ length: 110 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 8, c: pick(cols), r: Math.random() * 6 }));

    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });

}

    <p><label for="vsel"><b>Stimme</b></label>${vs.length ? `<select id="vsel" data-c="voice"><option value="">Automatisch (beste Stimme)</option>${vs.map(v => `<option ${v.name === S.set.voice ? 'selected' : ''} value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>` : '<br>Auf diesem Gerät wurde keine deutsche Stimme gefunden.'}</p>
    <p><label for="vrate"><b>Sprechtempo</b></label><input id="vrate" type="range" min="0.6" max="1.1" step="0.05" value="${S.set.rate}" data-c="rate" style="width:100%"></p>
    <p><button class="tab ${S.set.speak ? 'on' : ''}" data-a="tgl" data-k="speak">Vorlesen: ${S.set.speak ? 'an' : 'aus'}</button> <button class="tab ${S.set.sfx ? 'on' : ''}" data-a="tgl" data-k="sfx">Klänge: ${S.set.sfx ? 'an' : 'aus'}</button></p>
    <div class="note">Tipp fürs iPad: Unter Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Deutsch kannst du eine „Erweitert“- oder „Premium“-Stimme laden (zum Beispiel Anna oder Helena). Sie klingt deutlich natürlicher. Wähle sie hier danach aus. Im Reiter „Aufnahmen“ kannst du außerdem alles mit deiner eigenen Stimme einsprechen.</div>`;
  },
  rec() {
    const groups = recGroups();
    return `<h2>Aufnahmen mit deiner Stimme</h2>
    <p>Jede Zeile ist ein Baustein, den das Spiel vorliest. Deine Aufnahme hat Vorrang vor Cherry und der Gerätestimme. Nach dem Löschen wird wieder Cherry verwendet, sofern der Baustein mitgeliefert ist. Aufnahmen bleiben nur auf diesem Gerät.</p>
    <div class="note warn" id="recmsg">Wenn das Mikrofon hier gesperrt ist: Sprachmemo aufnehmen, in „Dateien“ sichern und mit 📁 laden. Buchstaben-Laute (zum Beispiel „mmm“) gehen nur mit eigener Aufnahme.</div>
    ${groups.map(g => `<details><summary style="font-weight:800;padding:10px 0;min-height:44px">${esc(g.cat)} (${g.items.length})</summary>${g.items.map(recRow).join('')}</details>`).join('')}`;
  },
  save() {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    return `<h2>Einstellungen und Sicherung</h2>
    <p><label for="nm"><b>Name im Spiel</b></label><input id="nm" type="text" maxlength="20" value="${esc(S.name)}" data-c="name"></p>
    <h3>Spielstand sichern</h3><p>Dieser Code enthält Freischaltungen, Sterne, Sticker und Lernstand (ohne Aufnahmen). Kopiere ihn und bewahre ihn in einer Notiz auf.</p>
    <textarea id="code" readonly>${code}</textarea>
    <p><button class="btn sm" data-a="copy">Code kopieren</button> <span id="cpmsg"></span></p>
    <h3>Spielstand laden</h3><textarea id="imp" placeholder="Code hier einfügen"></textarea>
    <p><button class="btn sm ghost" data-a="import">Laden</button> <span id="immsg"></span></p>
    <h3>Zurücksetzen</h3><p><button class="btn sm rose" data-a="reset">Alles zurücksetzen</button> <span id="rsmsg"></span></p>`;
  }
};
ACT.setRange = b => { const r = +b.dataset.r; if (!RANGES.includes(r) || r === rangeNow()) return; S.set.range = r; NUMSK.forEach(k => { Object.assign(sk(k), { lv: 1, st: 0, ws: 0 }); }); save(); parentArea('numbers'); };
ACT.unlockNext = () => { const l = ORDER.find(x => !S.unlocked[x]); if (l) { S.unlocked[l] = 1; save(); } parentArea(); };
ACT.ltog = b => {
  const l = b.dataset.l;
  if (S.unlocked[l]) { if (LETTERS.filter(x => S.unlocked[x]).length > 1) delete S.unlocked[l]; } else S.unlocked[l] = 1;
  save(); parentArea();
};
ACT.vtest = () => speak([T('Hallo! Ich bin dein Koala-Detektiv. Wie viel ist drei plus zwei?')], true);
ACT.tgl = b => { S.set[b.dataset.k] = !S.set[b.dataset.k]; save(); parentArea(); };
app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.c === 'voice') { S.set.voice = t.value; save(); chooseVoice(); }
  else if (t.dataset.c === 'rate') { S.set.rate = +t.value; save(); }
  else if (t.dataset.k && t.type === 'file' && t.files[0]) { clipPut(t.dataset.k, t.files[0]); markRow(t.closest('.row'), t.dataset.k); }
});
app.addEventListener('input', e => { if (e.target.dataset.c === 'name') { S.name = e.target.value.trim().slice(0, 20) || 'Sternchen'; save(); } });
ACT.copy = async () => {
  const ta = $('#code'), m = $('#cpmsg');
  try { await navigator.clipboard.writeText(ta.value); m.textContent = 'Kopiert.'; } catch (e) { ta.select(); m.textContent = 'Bitte den markierten Code kopieren.'; }
};
ACT.import = () => {
  const m = $('#immsg');
  try { const o = JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); if (!o.unlocked) throw 0; S = Object.assign(defaults(), o); S.set = Object.assign(defaults().set, o.set || {}); save(); chooseVoice(); parentArea('save'); $('#immsg').textContent = 'Geladen.'; }
  catch (e) { m.textContent = 'Der Code ist nicht gültig.'; }
};
let resetArmed = false;
ACT.reset = () => {
  if (!resetArmed) { resetArmed = true; $('#rsmsg').textContent = 'Nochmal tippen zum Bestätigen.'; setTimeout(() => { resetArmed = false; const m = $('#rsmsg'); if (m) m.textContent = ''; }, 4000); return; }
  resetArmed = false; S = defaults(); save(); chooseVoice(); parentArea('save'); $('#rsmsg').textContent = 'Zurückgesetzt.';
};

/* ---- Aufnahme-Studio ---- */
function recGroups() {
  const words = []; Object.values(WORDS).forEach(a => a.forEach(w => { if (!words.find(x => x.t === w[0])) words.push({ k: 'w.' + w[0].toLowerCase(), t: w[0] + ' ' + w[1], say: w[0] }); }));
  STICKERS.forEach(s => { if (!words.find(x => x.say === s[0])) words.push({ k: 'w.' + s[0].toLowerCase(), t: s[0] + ' ' + s[1], say: s[0] }); });
  const lines = [];
  CASES.forEach(c => {
    c.intro.forEach((l, i) => lines.push({ k: `st.${c.id}.in.${i}`, t: l.t, say: l.t }));
    c.clues.forEach((l, i) => { lines.push({ k: `cl.${c.id}.${i}`, t: l.t, say: l.t }); lines.push({ k: `cs.${c.id}.${i}`, t: '→ ' + l.so, say: l.so }); });
    c.suspects.filter(s => s.no).forEach(s => lines.push({ k: 'sp.' + c.id + '.' + s.id, t: s.no, say: s.no }));
    c.outro.forEach((l, i) => lines.push({ k: `st.${c.id}.out.${i}`, t: l.t, say: l.t }));
  });
  return [
    { cat: 'Satzbausteine', items: Object.keys(PHR).map(k => ({ k: 'ph.' + k, t: PHR[k], say: PHR[k] })) },
    { cat: 'Zahlen 0 bis 10', items: NUMW.slice(0, 11).map((w, i) => ({ k: 'n.' + i, t: `${i} (${w})`, say: w })) },
    { cat: 'Zahlen 11 bis 20', items: NUMW.slice(11, 21).map((w, i) => ({ k: 'n.' + (i + 11), t: `${i + 11} (${w})`, say: w })) },
    { cat: 'Zahlen 21 bis 100', items: NUMW.slice(21).map((w, i) => ({ k: 'n.' + (i + 21), t: `${i + 21} (${w})`, say: w })) },
    { cat: 'Formen', items: SHAPES.map(s => ({ k: 'fo.' + s[0].toLowerCase(), t: `Tippe auf ${s[2]} ${s[0]}. ${s[1]}`, say: `Tippe auf ${s[2]} ${s[0]}.` })).concat(SHAPES.map(s => ({ k: 'w.' + s[0].toLowerCase(), t: s[0] + ' ' + s[1], say: s[0] }))) },
    { cat: 'Buchstaben-Namen', items: LETTERS.map(L => ({ k: 'l.' + L, t: L, say: LSAY[L] })) },
    { cat: 'Buchstaben-Laute (nur eigene Aufnahme)', items: LETTERS.map(L => ({ k: 's.' + L, t: 'Laut ' + L, say: '' })) },
    { cat: 'Wörter und Tiere', items: words },
    { cat: 'Geschichten und Hinweise', items: lines }
  ];
}
function recRow(it) {
  const has = CLIPS.has(it.k);
  return `<div class="row" data-k="${esc(it.k)}"><span class="lbl">${esc(it.t)}</span><span class="st">${has ? 'Eigene Aufnahme ✓' : BUNDLED.has(it.k) ? 'Cherry ✓' : it.say ? 'iPad-Stimme' : 'keine'}</span>
  <button class="mini" data-a="rplay" data-k="${esc(it.k)}" data-s="${esc(it.say)}" aria-label="Anhören">▶</button>
  <button class="mini" data-a="rrec" data-k="${esc(it.k)}" aria-label="Aufnehmen">●</button>
  <button class="mini" data-a="rdel" data-k="${esc(it.k)}" data-s="${esc(it.say)}" aria-label="Aufnahme löschen">🗑</button>
  <label class="mini" style="display:grid;place-items:center;cursor:pointer" aria-label="Datei laden">📁<input type="file" accept="audio/*" hidden data-k="${esc(it.k)}"></label></div>`;
}
function markRow(row, k) { const st = $('.st', row); if (st) st.textContent = CLIPS.has(k) ? 'Eigene Aufnahme ✓' : BUNDLED.has(k) ? 'Cherry ✓' : (row.querySelector('[data-s]').dataset.s ? 'iPad-Stimme' : 'keine'); }
ACT.rplay = b => speak([{ k: b.dataset.k, t: b.dataset.s }], true);
ACT.rdel = b => { clipDel(b.dataset.k); markRow(b.closest('.row'), b.dataset.k); };
let REC = null;
ACT.rrec = async b => {
  const k = b.dataset.k, row = b.closest('.row'), st = $('.st', row);
  if (REC) { if (REC.mr.state !== 'inactive') REC.mr.stop(); return; }
  try {
    stopSpeech();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : {}), chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); if (REC) clearTimeout(REC.to); REC = null; b.classList.remove('rec'); b.textContent = '●';
      const blob = new Blob(chunks, { type: mr.mimeType || mime || 'audio/mp4' });
      if (blob.size > 500) clipPut(k, blob); markRow(row, k);
    };
    REC = { mr, to: setTimeout(() => { if (mr.state !== 'inactive') mr.stop(); }, 9000) };
    mr.start(); b.classList.add('rec'); b.textContent = '■'; st.textContent = 'Aufnahme läuft …';
  } catch (e) {
    st.textContent = 'Mikrofon gesperrt'; const m = $('#recmsg'); if (m) m.textContent = 'Das Mikrofon ist hier nicht erlaubt. Nimm eine Sprachmemo auf, sichere sie in „Dateien“ und lade sie mit 📁. In der fertigen App auf dem iPad fragt Safari einmal nach der Erlaubnis.';
  }
};

/* ================= Start ================= */
loadState();
const recordingsReady = idbOpen().then(idbAll);
const audioReady = loadAudioPack();
if (new URLSearchParams(location.search).has('audio-test')) ACT.audioTest(); else startScreen();
window.__game = { S: () => S, SES: () => SES, ACT, CLIPS };

if (!AUDIO_PACK.standalone && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.addEventListener('controllerchange', () => prepareAudioPack());
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js' + (AUDIO_PACK.webVersion ? '?v=' + AUDIO_PACK.webVersion : '')).then(() => prepareAudioPack()).catch(() => {
    showPackStatus('Online spielbar. Offline-Webseite konnte nicht eingerichtet werden.');
  }));
}
</script>
</body>
